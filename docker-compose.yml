services:
  app:
    build:
      context: .
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      NEXGEN_ENV: ${NEXGEN_ENV:-development}
      NEXGEN_FORCE_HTTPS: ${NEXGEN_FORCE_HTTPS:-false}
      NEXGEN_DB_HOST: ${NEXGEN_DB_HOST:?Set NEXGEN_DB_HOST in .env}
      NEXGEN_DB_PORT: ${NEXGEN_DB_PORT:-3306}
      NEXGEN_DB_NAME: ${NEXGEN_DB_NAME:?Set NEXGEN_DB_NAME in .env}
      NEXGEN_DB_USER: ${NEXGEN_DB_USER:?Set NEXGEN_DB_USER in .env}
      NEXGEN_DB_PASSWORD: ${NEXGEN_DB_PASSWORD:?Set NEXGEN_DB_PASSWORD in .env}
      NEXGEN_PRIVATE_UPLOAD_DIR: /data/nexgen-private
      NEXGEN_UPLOAD_QUARANTINE_DIR: /tmp/nexgen-upload-quarantine
      NEXGEN_UPLOAD_ENCRYPTION_KEY: ${NEXGEN_UPLOAD_ENCRYPTION_KEY:?Set NEXGEN_UPLOAD_ENCRYPTION_KEY in .env}
      NEXGEN_PYTHON_BIN: /opt/nexgen-upload-venv/bin/python
      NEXGEN_UPLOAD_SANITIZER_PATH: /app/CODE/PHP/upload_sanitizer.py
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_SECONDS: 8
      NEXGEN_RESEND_API_KEY: ${NEXGEN_RESEND_API_KEY:-}
      NEXGEN_RESEND_FROM_ADDRESS: ${NEXGEN_RESEND_FROM_ADDRESS:-}
      NEXGEN_RESEND_FROM_NAME: ${NEXGEN_RESEND_FROM_NAME:-NexGen}
    volumes:
      - nexgen_private_uploads:/data/nexgen-private
    tmpfs:
      - /tmp/nexgen-upload-quarantine:uid=33,gid=33,mode=0700,size=536870912
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_signatures:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

volumes:
  nexgen_private_uploads:
  clamav_signatures:
